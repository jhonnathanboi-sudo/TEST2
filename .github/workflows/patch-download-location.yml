name: Patch download location setting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch App.jsx
        shell: bash
        run: python scripts/patch-download-location.py

      - name: Commit App.jsx and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx scripts/patch-download-location.py
          git rm .github/workflows/patch-download-location.yml
          git commit -m "Add configurable download location"
          git push
