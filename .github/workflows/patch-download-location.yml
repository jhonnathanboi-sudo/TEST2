name: Patch download location setting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch App.jsx
        shell: python
        run: |
          from pathlib import Path

          path = Path("App.jsx")
          text = path.read_text(encoding="utf-8")

          old = 'const CATEGORY_STORAGE_KEY =\n  "github-store-default-category";'
          new = '''const CATEGORY_STORAGE_KEY =
  "github-store-default-category";

const DOWNLOAD_LOCATION_STORAGE_KEY =
  "github-store-download-location";'''
          if old not in text:
              raise SystemExit("Could not find CATEGORY_STORAGE_KEY")
          text = text.replace(old, new, 1)

          old = '''  const [downloadingAll, setDownloadingAll] =
    useState(false);'''
          new = '''  const [downloadingAll, setDownloadingAll] =
    useState(false);

  const [downloadLocation, setDownloadLocation] =
    useState(() => {
      try {
        return localStorage.getItem(
          DOWNLOAD_LOCATION_STORAGE_KEY
        ) || "";
      } catch {
        return "";
      }
    });

  const [downloadLocationError, setDownloadLocationError] =
    useState("");'''
          if old not in text:
              raise SystemExit("Could not find downloadingAll state")
          text = text.replace(old, new, 1)

          marker = '''  const isEditorDirty = useMemo(
'''
          insert = '''  const persistDownloadLocation = async (location) => {
    const value = String(location || "").trim();

    try {
      if (value) {
        localStorage.setItem(
          DOWNLOAD_LOCATION_STORAGE_KEY,
          value
        );
      } else {
        localStorage.removeItem(
          DOWNLOAD_LOCATION_STORAGE_KEY
        );
      }
    } catch (error) {
      console.error(
        "Failed to save download location:",
        error
      );
    }

    setDownloadLocation(value);

    const setter =
      window.electronAPI?.downloads?.setDirectory ||
      window.electronAPI?.setDownloadDirectory;

    if (setter) {
      try {
        await setter(value || null);
      } catch (error) {
        console.error(
          "Failed to apply download location:",
          error
        );
      }
    }
  };

  const handleChooseDownloadLocation = async () => {
    setDownloadLocationError("");

    const picker =
      window.electronAPI?.downloads?.chooseDirectory ||
      window.electronAPI?.chooseDownloadDirectory ||
      window.electronAPI?.selectDownloadFolder;

    if (picker) {
      try {
        const result = await picker();
        const selectedPath =
          typeof result === "string"
            ? result
            : result?.path || result?.directory || result?.folderPath;

        if (selectedPath) {
          await persistDownloadLocation(selectedPath);
        }

        return;
      } catch (error) {
        console.error(
          "Failed to choose download location:",
          error
        );

        setDownloadLocationError(
          error?.message ||
            "Could not choose a download folder."
        );
        return;
      }
    }

    if (typeof window.showDirectoryPicker === "function") {
      try {
        const handle = await window.showDirectoryPicker();
        if (handle?.name) {
          await persistDownloadLocation(handle.name);
        }
        return;
      } catch (error) {
        if (error?.name === "AbortError") return;

        console.error(
          "Failed to choose download location:",
          error
        );

        setDownloadLocationError(
          error?.message ||
            "Could not choose a download folder."
        );
        return;
      }
    }

    setDownloadLocationError(
      "Folder selection is not available in this build yet."
    );
  };

  const handleClearDownloadLocation = async () => {
    await persistDownloadLocation("");
    setDownloadLocationError("");
  };

'''
          if marker not in text:
              raise SystemExit("Could not find editor dirty marker")
          text = text.replace(marker, insert + marker, 1)

          old = '''          selectedRelease.id,
          asset.id
        );'''
          new = '''          selectedRelease.id,
          asset.id,
          downloadLocation || undefined
        );'''
          if old not in text:
              raise SystemExit("Could not find downloadRelease call")
          text = text.replace(old, new, 1)

          marker = '''            {/* CATEGORY SETTINGS */}'''
          insert = '''            {/* DOWNLOAD SETTINGS */}

            <div className="settings-card">

              <div>
                <h3>
                  Download location
                </h3>

                <p>
                  Choose where GitHub Store should save downloaded app files.
                </p>

                <div
                  style={{
                    marginTop: "10px",
                    color: "#777",
                    fontSize: "13px",
                    wordBreak: "break-all",
                  }}
                >
                  {downloadLocation || "Default Downloads folder"}
                </div>

                {downloadLocationError && (
                  <div
                    className="auth-error"
                    style={{ marginTop: "12px" }}
                  >
                    {downloadLocationError}
                  </div>
                )}
              </div>

              <div
                style={{
                  display: "flex",
                  gap: "10px",
                  alignItems: "center",
                  flexWrap: "wrap",
                }}
              >
                <button
                  className="secondary-button"
                  type="button"
                  onClick={handleChooseDownloadLocation}
                >
                  Change location
                </button>

                {downloadLocation && (
                  <button
                    className="secondary-button"
                    type="button"
                    onClick={handleClearDownloadLocation}
                  >
                    Use default
                  </button>
                )}
              </div>

            </div>

'''
          if marker not in text:
              raise SystemExit("Could not find category settings marker")
          text = text.replace(marker, insert + marker, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove patch workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-download-location.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx .github/workflows/patch-download-location.yml
          git commit -m "Add configurable download location" || exit 0
          git push
